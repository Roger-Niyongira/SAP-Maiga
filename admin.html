<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - SAP Maiga</title>
    <link rel="stylesheet" href="maiga.css">
</head>

<body>
    <header class="top-bar">
        <a href="index.html" aria-label="Accueil">
            <img src="images/UNICEF_logo.png" alt="UNICEF" class="logo">
        </a>

        <nav aria-label="Navigation principale">
            <a href="index.html" class="nav-button">
                Tableau de bord
            </a>
            <a href="manuel-utilisation.html" class="nav-button">
                Manuel d’utilisation
            </a>
        </nav>

        <a href="admin.html" class="admin-link" aria-current="page">
            Admin
        </a>
    </header>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Connexion administrateur</h1>

            <form class="login-form" id="login-form">
                <label for="username">Nom d’utilisateur</label>
                <input type="text" id="username" name="username" autocomplete="username" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit" class="login-submit">
                    Se connecter
                </button>

                <p id="login-message" role="status"></p>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();

            document.getElementById("login-message").textContent =
                "La connexion au serveur a échoué.";
        });
    </script>
</body>

</html>
